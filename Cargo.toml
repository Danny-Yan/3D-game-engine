[package]
name = "wgpu_engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wgpu_engine"
path = "src/main.rs"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity", "x11", "rwh_05"] }
env_logger = "0.10"
log = "0.4"
wgpu = "25.0"
pollster = "0.3"
bytemuck = { version = "1.16", features = [ "derive" ] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.48"
typetag = "0.2.20"
cgmath = "0.18"
bincode = "2.0.1"
chrono = "0.4"

# EGUI
egui-wgpu = "0.32.1"
cfg-if = "1.0.3"
egui-winit = "0.32.1"
egui = "0.32.1"
tobj = { version = "3.2", default-features = false, features = ["async"]}
fbx = "0.2.0"
tokio = { version = "1.47.1", features = ["full"] }
use = "0.0.1-pre.0"
struct_as_array = "0.2.0"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "25.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
# Handling HTTP requests when using WASM
reqwest = { version = "0.11" }

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

# RUN LOCAL
# cargo run
# bacon

# RUN ON WEB
# wasm-pack build --dev --target web


